<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Peak — Восстановление пароля</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-title {
            font-family: 'PT Serif', serif;
            font-size: 24px;
            font-weight: 700;
            color: #111;
            text-align: center;
            margin-bottom: 8px;
        }
        .form-sub {
            font-family: 'PT Sans', sans-serif;
            font-size: 15px;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .error-msg {
            color: #dc3545;
            font-family: 'PT Sans', sans-serif;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <img class="logo" src="/css/data/testlogo2.png" alt="Логотип" width="250" height="200">
            <div class="info">
                <a href="/about">О нас</a>
                <a href="/catalog">Каталог</a>
            </div>
            <form method="GET" action="/catalog" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." class="search-input">
                <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
            </form>
            <a href="/register" class="register">Регистрация</a>
        </div>

        <div class="formContainer">
            <button onclick="window.location.href='/login'" class="btn-back">←</button>

            <div class="inputForms">
                <p class="form-title">Восстановление пароля</p>
                <p class="form-sub">Введите email, привязанный к вашему аккаунту.<br>Мы отправим код для сброса пароля.</p>

                {% if error %}
                    <p class="error-msg">{{ error }}</p>
                {% endif %}

                <form method="POST" action="/forgot-password">
                    <input type="email" name="email" placeholder="Адрес электронной почты" required>
                    <button type="submit">Отправить код</button>
                    <p><a href="/login">Вернуться ко входу</a></p>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
