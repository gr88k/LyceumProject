<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Peak — Новый пароль</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-title {
            font-family: 'PT Serif', serif;
            font-size: 24px;
            font-weight: 700;
            color: #111;
            text-align: center;
            margin-bottom: 8px;
        }
        .form-sub {
            font-family: 'PT Sans', sans-serif;
            font-size: 15px;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .error-msg {
            color: #dc3545;
            font-family: 'PT Sans', sans-serif;
            font-size: 14px;
            text-align: center;
        }
        /* Ограничиваем ширину формы и центрируем */
        .inputForms {
            max-width: 420px;
            margin: 0 auto;
        }
        .inputForms form {
            align-items: stretch !important;
        }
        .password-wrap {
            position: relative;
            width: 100%;
        }
        .password-wrap input {
            width: 100%;
            padding-right: 44px;
            box-sizing: border-box;
        }
        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 14px;
            padding: 4px 6px;
            line-height: 1;
            box-shadow: none !important;
            transition: color 0.2s;
            /* Переопределяем стили от .inputForms button */
            background: transparent !important;
            border-radius: 0 !important;
            letter-spacing: 0 !important;
            font-weight: normal !important;
            color: #888 !important;
            min-width: unset !important;
            width: auto !important;
            height: auto !important;
        }
        .eye-btn:hover {
            color: #111 !important;
            background: transparent !important;
            transform: translateY(-50%) !important;
            box-shadow: none !important;
        }
        .strength-bar-wrap {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: -28px;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <img class="logo" src="/css/data/testlogo2.png" alt="Логотип" width="250" height="200">
            <div class="info">
                <a href="/about">О нас</a>
                <a href="/catalog">Каталог</a>
            </div>
            <form method="GET" action="/catalog" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." class="search-input">
                <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
            </form>
            <a href="/register" class="register">Регистрация</a>
        </div>

        <div class="formContainer">
            <button onclick="window.location.href='/login'" class="btn-back">←</button>

            <div class="inputForms">
                <p class="form-title">Новый пароль</p>
                <p class="form-sub">Придумайте новый пароль для вашего аккаунта.<br>Минимум 6 символов.</p>

                {% if error %}
                    <p class="error-msg">{{ error }}</p>
                {% endif %}

                <form method="POST" action="/new-password" id="pwd-form">

                    <div class="password-wrap">
                        <input type="password" name="password1" id="pwd1"
                               placeholder="Новый пароль" required autocomplete="new-password">
                        <button type="button" class="eye-btn" onclick="toggleEye('pwd1', 'eye1')">
                            <i class="fas fa-eye" id="eye1"></i>
                        </button>
                    </div>

                    <div class="strength-bar-wrap">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>

                    <div class="password-wrap">
                        <input type="password" name="password2" id="pwd2"
                               placeholder="Повторите пароль" required autocomplete="new-password">
                        <button type="button" class="eye-btn" onclick="toggleEye('pwd2', 'eye2')">
                            <i class="fas fa-eye" id="eye2"></i>
                        </button>
                    </div>

                    <button type="submit">Сохранить пароль</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleEye(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Индикатор силы пароля
        document.getElementById('pwd1').addEventListener('input', function () {
            const val = this.value;
            const bar = document.getElementById('strength-bar');
            let strength = 0;
            if (val.length >= 6)  strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            const widths = ['0%', '20%', '40%', '65%', '85%', '100%'];
            const colors = ['#eee', '#dc3545', '#fd7e14', '#ffc107', '#20c997', '#28a745'];
            bar.style.width  = widths[strength];
            bar.style.background = colors[strength];
        });

        // Подсветка совпадения паролей
        document.getElementById('pwd2').addEventListener('input', function () {
            const match = this.value === document.getElementById('pwd1').value;
            this.style.borderColor = this.value ? (match ? '#28a745' : '#dc3545') : '#000';
        });
    </script>
</body>
</html>
