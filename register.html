<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Peak</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class = "container">
                <div class="top">
            <img class="logo" src="/css/data/testlogo2.png" alt="Логотип">
            <div class="info">
                <a href="/about"><span class="nav-text">О нас</span><span class="nav-icon"><i class="fas fa-info-circle"></i></span></a>
                <a href="/catalog"><span class="nav-text">Каталог</span><span class="nav-icon"><i class="fas fa-th-large"></i></span></a>
            </div>
            <form method="GET" action="/catalog" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." value="{{ request.args.get('q', '') }}" class="search-input">
                <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
            </form>
            <div class="top-right-group">
                <a href="/register" class="register">
                    <span class="profile-text">Регистрация</span>
                    <span class="profile-icon"><i class="fas fa-user"></i></span>
                </a>
            </div>
        </div>

            <div class="formContainer">
                <button onclick="window.location.href='/catalog'" class="btn-back">←</button>

                <div class = "inputForms">
                    <form method="POST" action="/register">
                        {% if error %}
                            <p style="color:#dc3545;font-family:'PT Sans',sans-serif;font-size:14px;text-align:center;margin-bottom:-20px;">{{ error }}</p>
                        {% endif %}
                        <input type="text" placeholder="Имя" name = "username" required>
                        <input type="email" placeholder="Адрес электронной почты" name = "email" required>
                        <input type="tel" placeholder="Номер телефона" name = "tel" required>
                        <input type="password" placeholder="Пароль" name = "password" required>

                        <button type = "submit" class = "sbm-btn">Регистрация</button>
                        <p>Уже есть аккаунт? <a href = "/login">Логин</a></p>
                    </form>
                </div>
            </div>
    </div>
</body>
