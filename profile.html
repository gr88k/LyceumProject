<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Peak</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class = "container">
                <div class="top">
            <img class="logo" src="/css/data/testlogo2.png" alt="Логотип">
            <div class="info">
                <a href="/about"><span class="nav-text">О нас</span><span class="nav-icon"><i class="fas fa-info-circle"></i></span></a>
                <a href="/catalog"><span class="nav-text">Каталог</span><span class="nav-icon"><i class="fas fa-th-large"></i></span></a>
            </div>
            <form method="GET" action="/catalog" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." value="{{ request.args.get('q', '') }}" class="search-input">
                <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
            </form>
            <div class="top-right-group">
                <div class="dropdown">
                    <span class="register">
                        <span class="profile-text">Профиль ▼</span>
                        <span class="profile-icon"><i class="fas fa-user"></i> ▾</span>
                    </span>
                    <div class="dropdown-menu">
                        <a href="{{ url_for('profile') }}">Личный кабинет</a>
                        <a href="{{ url_for('my_orders') }}">Мои заказы</a>
                        {% if current_user.role == 'Admin' %}
                            <hr>
                            <a href="{{ url_for('admin_orders') }}">Заказы</a>
                            <a href="{{ url_for('admin_products') }}">Товары</a>
                        {% endif %}
                        <hr>
                        <a href="{{ url_for('logout') }}">Выйти</a>
                    </div>
                </div>
            </div>
        </div>

        <div class = "profileContainer">
            <button onclick="window.location.href='/catalog'" class="btn-back">←</button>
            <p>Здравствуйте, {{current_user.username}}!</p>
            <p>Редактирование профиля</p>

            <div class = "inputForms">
                    <form method="POST" action="/profile">
                        <div class="form-group">
                            <label for="username">Имя пользователя</label>
                            <input type="text" 
                            id="username" 
                            name="username" 
                            value="{{ user.username }}" 
                            required>
                        </div>

                        <div class="form-group">
                            <label for="email">Адрес электронной почты</label>
                            <input type="text" 
                            id="email" 
                            name="email" 
                            value="{{ user.email }}" 
                            required>
                        </div>

                        <div class="form-group">
                            <label for="tel">Номер телефона</label>
                            <input type="text" 
                            id="tel" 
                            name="tel" 
                            value="{{ user.tel }}" 
                            required>
                        </div>

                        <button type = "submit" class = "sbm-btn">Подтвердить</button>
                    </form>
                </div>
        </div>
    </div>
</body>
